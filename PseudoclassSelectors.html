<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pseudo-class Selectors 🤗</title>
  <link rel="stylesheet" href="./PseudoclassSelectors.css">
</head>

<body>
  <!-- ! :hover -->
  <button id="btn">Hover</button>
  <hr>
  <!-- ! :focus -->
  <input type="email" placeholder="Enter your email">
  <input type="password" placeholder="Enter your password">
  <hr>
  <!-- ! :active and :visited -->
  <a href="https://www.flipkart.com">Flipkart</a>
  <a href="https://www.myntra.com">Myntra</a>
  <hr>
  <!-- ! :first-child , :last-child and nth-child() -->
  <div>
    <p>Para-1</p>
    <p>Para-2</p>
    <p>Para-3</p>
    <p>Para-4</p>
    <p>Para-5</p>
    <p>Para-6</p>
    <p>Para-7</p>
    <p>Para-8</p>
    <p>Para-9</p>
    <p>Para-10</p>
  </div>
  <!-- ! :not() -->
   <ul>
    <li>Pavan</li>
    <li id="exclude">Monty</li>
    <li>Deva</li>
    <li>Ajit</li>
   </ul>
   <hr>
   <!-- ! :checked -->
  <label>Gender:</label>
  <input type="radio" name="gender" id="male">
  <label for="male">Male</label>
  <input type="radio" name="gender" id="female">
  <label for="female">Female</label>
</body>

</html>
