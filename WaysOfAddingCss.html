<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ways of Adding Css 💥</title>
  <style>
    p{
      color: yellow;
      background-color:green;
    }
    a{
      color:tomato;
      background-color: aqua;
    }
  </style>
  <link rel="stylesheet" href="External.css">
</head>
<body>
  <!-- Inline Css -->
  <h1 style="color:white;background-color: red;">Good Evening Guys 🤗</h1>
  <button style="color:white;background-color: royalblue;">Click</button>
  <hr>
  <!-- Internal Css -->
   <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Molestiae, debitis aspernatur! Quasi mollitia nostrum deleniti obcaecati sed cum, dolor omnis. Quasi suscipit reprehenderit veniam quo!</p>
   <a href="#">Google</a>
   <hr>
   <!-- External Css -->
    <ol>
      <li>Samosa</li>
      <li>Kachori</li>
      <li>Pani Puri</li>
    </ol>
</body>
</html>
